spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/burunzhuy
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml
  jwt:
    secret: ${env.JWT_SECRET}
    expiration: 86400000